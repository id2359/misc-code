<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLYWA :: 70s CRT Terminal Polyhedra</title>
<style>
:root {
    --crt-phosphor: #00ff41;
    --crt-bg: #001200;
    --crt-glow: rgba(0, 255, 65, 0.25);
    --crt-dim: #007722;
}

[data-theme="amber"] {
    --crt-phosphor: #ffb000;
    --crt-bg: #1a0f00;
    --crt-glow: rgba(255, 176, 0, 0.25);
    --crt-dim: #805800;
}

[data-theme="cyan"] {
    --crt-phosphor: #00f0ff;
    --crt-bg: #001218;
    --crt-glow: rgba(0, 240, 255, 0.25);
    --crt-dim: #007080;
}

[data-theme="white"] {
    --crt-phosphor: #e6e6e6;
    --crt-bg: #111111;
    --crt-glow: rgba(230, 230, 230, 0.22);
    --crt-dim: #666666;
}

* {
    box-sizing: border-box;
}

body {
    background: #080808;
    margin: 0;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "Courier New", "Lucida Console", Monaco, monospace;
    color: var(--crt-phosphor);
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
}

.crt-frame {
    position: relative;
    background: #141614;
    border: 3px solid #2b2e2b;
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.6);
    max-width: 98vw;
}

.crt-monitor {
    position: relative;
    background: radial-gradient(ellipse at center, var(--crt-bg) 0%, #000000 100%);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: inset 0 0 45px var(--crt-glow), inset 0 0 10px rgba(0,0,0,0.8);
    cursor: grab;
}

.crt-monitor:active {
    cursor: grabbing;
}

/* CRT Scanlines and Glass Curvature Effect */
.crt-monitor::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
    background-size: 100% 3px, 4px 100%;
    z-index: 10;
    pointer-events: none;
}

.crt-monitor::after {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: radial-gradient(ellipse at center, transparent 65%, rgba(0, 0, 0, 0.55) 100%);
    z-index: 11;
    pointer-events: none;
}

#term {
    font-family: "Courier New", "Lucida Console", "DejaVu Sans Mono", monospace;
    font-size: 11.5px;
    line-height: 1.05;
    letter-spacing: 0px;
    color: var(--crt-phosphor);
    text-shadow: 0 0 3px var(--crt-phosphor), 0 0 7px var(--crt-glow);
    white-space: pre;
    padding: 14px 18px;
    margin: 0;
    overflow: hidden;
}

/* Control Panel Bar */
.control-bar {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    align-items: center;
    max-width: 820px;
}

.btn-group {
    display: inline-flex;
    gap: 4px;
    background: #181a18;
    padding: 4px;
    border-radius: 6px;
    border: 1px solid #333;
}

.crt-btn {
    background: #111;
    color: var(--crt-phosphor);
    border: 1px solid var(--crt-dim);
    font-family: inherit;
    font-size: 11px;
    font-weight: bold;
    padding: 5px 9px;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s ease;
    box-shadow: 0 2px 0 #000;
}

.crt-btn:hover {
    background: var(--crt-dim);
    color: #fff;
    border-color: var(--crt-phosphor);
    box-shadow: 0 0 8px var(--crt-glow);
}

.crt-btn.active {
    background: var(--crt-phosphor);
    color: #000;
    border-color: #fff;
    box-shadow: 0 0 10px var(--crt-glow);
}

.crt-btn:active {
    transform: translateY(1px);
    box-shadow: none;
}

.theme-pill {
    padding: 4px 8px;
    font-size: 10px;
}

@media (max-width: 800px) {
    #term {
        font-size: 8px;
        padding: 8px;
    }
    .crt-btn {
        font-size: 9px;
        padding: 4px 6px;
    }
}
</style>
</head>
<body>

<div class="crt-frame">
    <div class="crt-monitor" id="monitor">
        <div id="term">INITIALIZING POLYWA CORE WASM SYSTEM...</div>
    </div>
</div>

<div class="control-bar">
    <div class="btn-group">
        <button class="crt-btn" onclick="selectShape(0)" id="btn-0">[1] TETRA</button>
        <button class="crt-btn" onclick="selectShape(1)" id="btn-1">[2] CUBE</button>
        <button class="crt-btn" onclick="selectShape(2)" id="btn-2">[3] OCTA</button>
        <button class="crt-btn" onclick="selectShape(3)" id="btn-3">[4] DODECA</button>
        <button class="crt-btn" onclick="selectShape(4)" id="btn-4">[5] ICOSA</button>
        <button class="crt-btn" onclick="selectShape(5)" id="btn-5">[6] CUBOCTA</button>
        <button class="crt-btn" onclick="selectShape(6)" id="btn-6">[7] STELLA</button>
    </div>

    <div class="btn-group">
        <button class="crt-btn" onclick="toggleAutoRotate()" id="btn-rot">⏯ ROTATE</button>
        <button class="crt-btn" onclick="toggleAutoCycle()" id="btn-cycle">⟳ CYCLE</button>
        <button class="crt-btn" onclick="cycleViewMode()" id="btn-mode">◫ VIEW</button>
        <button class="crt-btn" onclick="adjustSpeed(-0.25)">- SPD</button>
        <button class="crt-btn" onclick="adjustSpeed(0.25)">+ SPD</button>
    </div>

    <div class="btn-group">
        <button class="crt-btn theme-pill" onclick="setTheme('green')" style="color:#00ff41">GRN</button>
        <button class="crt-btn theme-pill" onclick="setTheme('amber')" style="color:#ffb000">AMB</button>
        <button class="crt-btn theme-pill" onclick="setTheme('cyan')" style="color:#00f0ff">CYN</button>
        <button class="crt-btn theme-pill" onclick="setTheme('white')" style="color:#e6e6e6">WHT</button>
    </div>
</div>

<script>
var currentSpeed = 1.0;
var viewMode = 0;

var Module = {
    setTerminalText: function(txt) {
        var el = document.getElementById('term');
        if (el) {
            el.textContent = txt;
        }
        updateActiveButton();
    }
};

function callWasm(name, ...args) {
    if (typeof Module['_' + name] === 'function') {
        return Module['_' + name](...args);
    }
    if (typeof Module[name] === 'function') {
        return Module[name](...args);
    }
    if (Module.asm && typeof Module.asm[name] === 'function') {
        return Module.asm[name](...args);
    }
    if (typeof Module.ccall === 'function') {
        try {
            return Module.ccall(name, 'number', args.map(function(a) { return typeof a === 'number' ? 'number' : 'string'; }), args);
        } catch(e) {}
    }
}

function updateActiveButton() {
    var cur = callWasm('get_current_shape');
    if (cur !== undefined && cur !== null) {
        for (var i = 0; i <= 6; i++) {
            var b = document.getElementById('btn-' + i);
            if (b) {
                if (i === cur) b.classList.add('active');
                else b.classList.remove('active');
            }
        }
    }
}

function selectShape(idx) {
    callWasm('set_shape', idx);
    updateActiveButton();
}

function toggleAutoRotate() {
    callWasm('toggle_auto_rotate');
}

function toggleAutoCycle() {
    callWasm('toggle_auto_cycle');
}

function adjustSpeed(delta) {
    currentSpeed = Math.max(0.2, Math.min(4.0, currentSpeed + delta));
    callWasm('set_rotation_speed', currentSpeed);
}

function cycleViewMode() {
    viewMode = (viewMode + 1) % 3;
    callWasm('set_render_mode', viewMode);
}

function setTheme(theme) {
    if (theme === 'green') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
}

// Mouse / Touch 3D drag rotation
var isDragging = false;
var lastX = 0, lastY = 0;
var monitor = document.getElementById('monitor');

monitor.addEventListener('mousedown', function(e) {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
});

window.addEventListener('mouseup', function() {
    isDragging = false;
});

window.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    var dx = e.clientX - lastX;
    var dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    callWasm('rotate_manual', dx * 0.3, dy * 0.3);
});

// Touch support for mobile / tablets
monitor.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
        isDragging = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
    }
}, {passive: true});

window.addEventListener('touchend', function() {
    isDragging = false;
});

window.addEventListener('touchmove', function(e) {
    if (!isDragging || e.touches.length === 0) return;
    var dx = e.touches[0].clientX - lastX;
    var dy = e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
    callWasm('rotate_manual', dx * 0.3, dy * 0.3);
}, {passive: true});

// Keyboard controls
window.addEventListener('keydown', function(e) {
    var key = e.key;
    if (key >= '1' && key <= '7') {
        selectShape(parseInt(key) - 1);
    } else if (key === ' ') {
        e.preventDefault();
        toggleAutoRotate();
    } else if (key === 'Tab' || key === 'c' || key === 'C') {
        e.preventDefault();
        toggleAutoCycle();
    } else if (key === 'm' || key === 'M') {
        cycleViewMode();
    } else if (key === 'n' || key === 'N') {
        callWasm('next_shape');
        updateActiveButton();
    } else if (key === 'p' || key === 'P') {
        callWasm('prev_shape');
        updateActiveButton();
    } else if (key === '+' || key === '=') {
        adjustSpeed(0.25);
    } else if (key === '-' || key === '_') {
        adjustSpeed(-0.25);
    } else if (key === 't' || key === 'T') {
        var themes = ['green', 'amber', 'cyan', 'white'];
        var cur = document.documentElement.getAttribute('data-theme') || 'green';
        var next = themes[(themes.indexOf(cur) + 1) % themes.length];
        setTheme(next);
    } else if (key === 'ArrowLeft' || key === 'a') {
        callWasm('rotate_manual', -4, 0);
    } else if (key === 'ArrowRight' || key === 'd') {
        callWasm('rotate_manual', 4, 0);
    } else if (key === 'ArrowUp' || key === 'w') {
        callWasm('rotate_manual', 0, -4);
    } else if (key === 'ArrowDown' || key === 's') {
        callWasm('rotate_manual', 0, 4);
    }
});
</script>
<script src="polywa.js"></script>
</body>
</html>
